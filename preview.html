<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>桌宠动作预览</title>
  <style>
    :root { color-scheme: light; font-family: "Microsoft YaHei UI", "Microsoft YaHei", "PingFang SC", sans-serif; }
    body { min-height: 100vh; margin: 0; padding: 28px; color: #25304a; background: radial-gradient(circle at 80% -12%, #e9ebff, #f5f7fc 42%); }
    .layout { display: grid; grid-template-columns: 280px minmax(420px, 680px); gap: 26px; align-items: start; max-width: 990px; margin: 0 auto; }
    .preview { position: sticky; top: 28px; padding: 20px 10px 14px; border: 1px solid #e8ebf3; border-radius: 22px; background: #ffffffd9; box-shadow: 0 13px 35px #46527b12; text-align: center; }
    canvas { width: 250px; height: 271px; image-rendering: auto; }
    canvas.pixelated { image-rendering: pixelated; image-rendering: crisp-edges; }
    #now { min-height: 1.4em; margin-top: 4px; color: #6574ce; font-size: 12px; }
    h1 { margin: 0 0 7px; font-size: 26px; letter-spacing: -.035em; }
    .intro { margin: 0 0 20px; color: #7b8498; font-size: 12px; line-height: 1.6; }
    section { padding: 16px; border: 1px solid #e8ebf3; border-radius: 15px; background: #fff; box-shadow: 0 7px 24px #46527b08; }
    section + section { margin-top: 14px; }
    h2 { margin: 0 0 11px; font-size: 14px; }
    .buttons { display: flex; flex-wrap: wrap; gap: 7px; }
    button { padding: 7px 10px; border: 1px solid #e2e6ef; border-radius: 8px; color: #5f6c88; background: #fafbff; cursor: pointer; font-size: 11px; }
    button:hover, button:focus-visible { border-color: #aeb9ff; color: #5263d6; background: #f1f3ff; outline: none; }
    .directions { display: grid; grid-template-columns: repeat(8, 1fr); gap: 6px; }
    .directions button { min-width: 0; padding: 7px 2px; font-size: 10px; }
    .note { margin-top: 14px; color: #9aa3b5; font-size: 10px; line-height: 1.6; }
    @media (max-width: 760px) { body { padding: 18px; } .layout { grid-template-columns: 1fr; } .preview { position: static; max-width: 280px; margin: auto; } }
  </style>
</head>
<body>
  <div class="layout">
    <div class="preview"><canvas id="preview-canvas" width="192" height="208"></canvas><div id="now">待机</div></div>
    <div><h1 id="preview-title">桌宠动作预览</h1><p class="intro">点击按钮查看动作；方向按钮对应精灵图中的 16 个环绕视角。</p><section><h2>标准动作</h2><div id="actions" class="buttons"></div></section><section><h2>观察方向</h2><div id="directions" class="directions"></div></section><div class="note">独立桌宠运行时可以右键打开同样的动作菜单。</div></div>
  </div>
  <script src="src/copy.js"></script>
  <script src="src/pet-model.js"></script>
  <script src="src/direction-layout.js"></script>
  <script src="src/rendering.js"></script>
  <script src="src/pet-player.js"></script>
  <script>
    const now = document.getElementById('now');
    const canvas = document.getElementById('preview-canvas');
    function renderPreview(pet) {
      if (!pet) return;
      const mode = pet.manifest.renderingMode || 'pixelated';
      canvas.classList.toggle('pixelated', mode !== 'smooth');
      canvas.classList.toggle('smooth', mode === 'smooth');
      document.title = `${pet.manifest.displayName} · 动作预览`;
      document.getElementById('preview-title').textContent = `${pet.manifest.displayName} · 动作预览`;
      const player = PetPlayer.createPetPlayer({ canvas, spriteUrl: pet.spriteUrl, renderingMode: mode, onStateChange: state => { now.textContent = state.mode === 'look' ? `观察 ${PetPetCopy.formatDirectionLabel(state.direction)}` : PetModel.ACTIONS[state.action].label; } });
      player.setDemo(false);
      const actionBox = document.getElementById('actions');
      PetModel.listActionIds().forEach(id => { const button = document.createElement('button'); button.textContent = PetModel.ACTIONS[id].label; button.addEventListener('click', () => player.setAction(id, { loops: id === 'idle' ? 0 : 1 })); actionBox.appendChild(button); });
      const directionBox = document.getElementById('directions');
      PetModel.LOOK_DIRECTIONS.forEach(direction => { const button = document.createElement('button'); button.textContent = PetPetCopy.formatDirectionLabel(direction); button.title = `${direction}°`; button.addEventListener('click', () => player.setDirection(direction)); directionBox.appendChild(button); });
    }
    window.managerAPI.getPreviewPet().then(renderPreview).catch(() => {});
  </script>
</body>
</html>
